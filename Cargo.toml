[workspace]
resolver = "2"
members = [
    "crates/debut-core",
    "crates/debut-platform",
    "crates/debut-project",
    "crates/debut-command",
    "crates/debut-media",
    "crates/debut-timeline",
    "crates/debut-audio",
    "crates/debut-render",
    "crates/debut-graphics",
    "crates/debut-export",
    "crates/debut-collab",
    "crates/debut-collab-server",
    "crates/debut-plugin-host",
    "crates/debut-engine",
    "crates/debut-platform-native",
    "crates/debut-platform-web",
    "crates/debut-arch",
    "apps/desktop",
    "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blizzarac/debut"

[workspace.dependencies]
# Internal crates
debut-core = { path = "crates/debut-core" }
debut-platform = { path = "crates/debut-platform" }
debut-project = { path = "crates/debut-project" }
debut-command = { path = "crates/debut-command" }
debut-media = { path = "crates/debut-media" }
debut-timeline = { path = "crates/debut-timeline" }
debut-audio = { path = "crates/debut-audio" }
debut-render = { path = "crates/debut-render" }
debut-graphics = { path = "crates/debut-graphics" }
debut-export = { path = "crates/debut-export" }
debut-collab = { path = "crates/debut-collab" }
debut-collab-server = { path = "crates/debut-collab-server" }
debut-engine = { path = "crates/debut-engine" }
debut-platform-native = { path = "crates/debut-platform-native" }
debut-platform-web = { path = "crates/debut-platform-web" }

# Shared external deps (kept light until each crate needs them)
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
fontdue = "0.9"

# Planned, enabled per crate as work starts:
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
ffmpeg-next = "7"
cpal = "0.16"
wasm-bindgen = "0.2"
# web-sys = "0.3"        # debut-platform-web: WebCodecs, OPFS, AudioWorklet
tauri = "2"
tauri-build = "2"
# FCPXML import (MED-12): a read-only XML tree, no dependencies of its own
roxmltree = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
