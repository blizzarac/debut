[package]
name = "debut-desktop"
description = "Tauri desktop shell hosting the shared TypeScript UI over the native engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "debut_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
debut-engine.workspace = true
debut-scripting.workspace = true
debut-project.workspace = true
debut-platform-native.workspace = true
debut-collab-server.workspace = true
serde.workspace = true
# "unstable" for plain (webview-less) windows: the program monitor.
tauri = { workspace = true, features = ["unstable"] }
